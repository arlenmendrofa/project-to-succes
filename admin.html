<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Proyek | Project to succes by @Len</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", sans-serif;
        background: #07111f;
        color: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(124, 58, 237, 0.3), transparent 35%),
          linear-gradient(180deg, #020817, #0f172a);
      }

      a {
        color: #c4b5fd;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .container {
        width: min(980px, calc(100% - 2rem));
        margin: 0 auto;
      }

      header {
        padding: 1.25rem 0;
        border-bottom: 1px solid rgba(148, 163, 184, 0.24);
      }

      header .container,
      .heading-row,
      .project-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      header a {
        font-weight: 800;
        text-decoration: none;
      }

      main {
        padding: 3rem 0;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: -0.05em;
      }

      .panel {
        padding: clamp(1.25rem, 4vw, 2rem);
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.25);
      }

      .muted,
      .help {
        color: #94a3b8;
        line-height: 1.7;
      }

      .help {
        font-size: 0.9rem;
      }

      .form-grid,
      .project-list {
        display: grid;
        gap: 1rem;
      }

      label {
        display: grid;
        gap: 0.45rem;
        font-weight: 650;
      }

      input,
      textarea {
        width: 100%;
        padding: 0.8rem 0.9rem;
        color: #e2e8f0;
        background: #0b1220;
        border: 1px solid #334155;
        border-radius: 10px;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      input:focus,
      textarea:focus,
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #7c3aed;
        outline-offset: 2px;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }

      .checkbox-row input {
        width: auto;
      }

      .button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 44px;
        padding: 0.7rem 1rem;
        border: 1px solid transparent;
        border-radius: 999px;
        color: #fff;
        background: linear-gradient(135deg, #7c3aed, #0ea5e9);
        font-weight: 750;
        text-decoration: none;
        cursor: pointer;
      }

      .button.secondary {
        background: rgba(148, 163, 184, 0.1);
        border-color: rgba(148, 163, 184, 0.35);
      }

      .button.danger {
        background: #7f1d1d;
      }

      .button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .status {
        min-height: 1.5rem;
        margin: 0.8rem 0;
      }

      .status[data-error="true"] {
        color: #fca5a5;
      }

      .status[data-error="false"] {
        color: #86efac;
      }

      .project-list {
        margin-top: 1rem;
      }

      .project-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 14px;
        background: rgba(2, 8, 23, 0.4);
      }

      .project-item h3 {
        margin-bottom: 0.35rem;
      }

      .project-item p {
        margin-bottom: 0;
        color: #94a3b8;
        line-height: 1.6;
      }

      .project-actions {
        justify-content: flex-end;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 640px) {
        .heading-row,
        .project-item {
          align-items: stretch;
          grid-template-columns: 1fr;
          flex-direction: column;
        }

        .project-actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <a href="./">Project to succes by @Len</a>
        <a href="./">Lihat website</a>
      </div>
    </header>

    <main class="container">
      <section id="login-view" class="panel">
        <h1>Admin proyek</h1>
        <p class="muted">Masuk menggunakan akun Google pemilik website untuk mengelola proyek.</p>
        <button class="button" id="sign-in" type="button">Masuk dengan Google</button>
        <p class="status" id="login-status" role="status" aria-live="polite"></p>
      </section>

      <section id="admin-view" hidden>
        <div class="heading-row">
          <div>
            <h1>Kelola proyek</h1>
            <p class="muted" id="signed-in-user"></p>
          </div>
          <button class="button secondary" id="sign-out" type="button">Keluar</button>
        </div>

        <p class="status" id="admin-status" role="status" aria-live="polite"></p>

        <form class="panel form-grid" id="project-form">
          <h2 id="form-heading">Tambah proyek</h2>
          <label>
            Nama proyek
            <input name="title" maxlength="120" required />
          </label>
          <label>
            Kategori
            <input name="category" maxlength="60" required />
          </label>
          <label>
            Deskripsi
            <textarea name="description" maxlength="1000" required></textarea>
          </label>
          <label>
            URL gambar (opsional, harus HTTPS)
            <input name="imageUrl" type="url" maxlength="2048" placeholder="https://..." />
          </label>
          <label>
            Link proyek (opsional, harus HTTPS)
            <input name="link" type="url" maxlength="2048" placeholder="https://..." />
          </label>
          <label class="checkbox-row">
            <input name="published" type="checkbox" checked />
            Tampilkan di website
          </label>
          <p class="help">Unggah gambar belum diaktifkan; gunakan URL gambar HTTPS. Firebase Storage tidak dibuat.</p>
          <div class="project-actions">
            <button class="button" id="save-project" type="submit">Simpan proyek</button>
            <button class="button secondary" id="cancel-edit" type="button" hidden>Batal edit</button>
          </div>
        </form>

        <section class="panel" style="margin-top: 1.5rem" aria-labelledby="project-list-heading">
          <h2 id="project-list-heading">Daftar proyek</h2>
          <div class="project-list" id="project-list"></div>
        </section>
      </section>
    </main>

    <script type="module" src="./admin.js"></script>
  </body>
</html>
